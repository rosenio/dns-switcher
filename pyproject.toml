[project]
name = "dns_switcher"
version = "0.1.0"
description = "Tool to switch between DNS providers"
readme = "README.md"
authors = [
    { name = "rosenio", email = "kenio3d@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pyinstaller>=6.22.3",
    "pyside6>=6.12.0",
    "qtpy>=2.4.3",
]

[project.scripts]
dns-switcher = "dns_switcher:main"
build = "dns_switcher.build:run_build"



[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
